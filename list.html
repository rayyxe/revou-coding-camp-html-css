<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Unordered List (UL)</h2>
    <!-- List dibuat dari <ul> unordered list, tidak ada urutan-->
    <ul>
        <li
        type="disc">List ke 1</li>
        <li>List ke 2</li>
        <li>List ke 3</li>
    </ul>
    <hr> 
    <!-- type adalah atribut untuk mengubah bentuk list nya (kotak/bulet) -->
    <h2>Ordered List (OL)</h2>
    <ol type="A">
        <li>Pertama Lakukan Tahap 1</li>
        <li>Lalu Lakukan Tahap 2</li>
        <li>Kemudian Lakukan Tahap 3</li>
        <li>Terakhir Lakukan Tahap 4</li>
    </ol>
    <hr>
</body>
</html>
