<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir</title>

  <!-- Tailwind CSS v4 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: white;
      transition: all 0.3s ease;
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(168, 85, 247, 0.7);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25);
      outline: none;
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .glass-fieldset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .glass-fieldset legend {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      padding: 0 8px;
    }

    .gradient-btn {
      background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6);
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gradient-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.55);
    }

    .gradient-btn:active {
      transform: translateY(0);
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* custom checkbox */
    input[type="checkbox"] {
      accent-color: #a855f7;
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6"
      style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);">

  <!-- Decorative blobs -->
  <div class="fixed top-[-8rem] left-[-8rem] w-[28rem] h-[28rem] rounded-full pointer-events-none opacity-25"
       style="background: radial-gradient(circle, #a855f7, transparent 70%);"></div>
  <div class="fixed bottom-[-8rem] right-[-8rem] w-[32rem] h-[32rem] rounded-full pointer-events-none opacity-20"
       style="background: radial-gradient(circle, #3b82f6, transparent 70%);"></div>

  <!-- Glass Card -->
  <div class="glass-card rounded-3xl p-8 w-full max-w-lg relative z-10">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4"
           style="background: linear-gradient(135deg, #a855f7, #6366f1);">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Formulir Pendaftaran</h1>
      <p class="text-white/40 mt-1 text-sm">Lengkapi data diri Anda di bawah ini</p>
    </div>

    <!-- Form -->
    <form action="post" class="space-y-6">

      <!-- Nama -->
      <div class="space-y-1.5">
        <label for="nama" class="block text-xs font-semibold text-white/60 uppercase tracking-widest">
          Nama
        </label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/35">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </span>
          <input type="text" id="nama" name="nama"
                 placeholder="Masukkan nama lengkap Anda"
                 class="glass-input w-full rounded-xl pl-10 pr-4 py-3 text-sm" />
        </div>
      </div>

      <!-- Checkbox -->
      <label class="flex items-center gap-3 cursor-pointer group">
        <input type="checkbox" name="setuju" />
        <span class="text-sm text-white/50 group-hover:text-white/70 transition-colors">
          Saya menyetujui syarat dan ketentuan
        </span>
      </label>

      <!-- Fieldset: Terkait Anda -->
      <fieldset class="glass-fieldset rounded-2xl px-5 pt-2 pb-5 space-y-3">
        <legend class="text-sm px-2">Terkait Anda</legend>

        <div class="space-y-1.5">
          <label for="gender" class="block text-xs font-semibold text-white/60 uppercase tracking-widest">
            Jenis Kelamin Anda
          </label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/35 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </span>
            <!-- chevron -->
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-white/35 pointer-events-none">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </span>
            <select id="gender" name="gender"
                    class="glass-input w-full rounded-xl pl-10 pr-10 py-3 text-sm appearance-none cursor-pointer">
              <option value="" class="bg-[#302b63]">-- Pilih Jenis Kelamin --</option>
              <optgroup label="Gender" class="bg-[#302b63]">
                <option value="laki" class="bg-[#302b63]">Laki-Laki</option>
                <option value="perempuan" class="bg-[#302b63]">Perempuan</option>
              </optgroup>
              <optgroup label="Pilihan" class="bg-[#302b63]">
                <option value="prefer_not" class="bg-[#302b63]">Prefer Not to Say</option>
              </optgroup>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- Motivasi -->
      <div class="space-y-1.5">
        <label for="motivasi" class="block text-xs font-semibold text-white/60 uppercase tracking-widest">
          Apa Motivasi Anda
        </label>
        <textarea id="motivasi" name="motivasi" cols="30" rows="5"
                  placeholder="Ceritakan motivasi Anda untuk bergabung…"
                  class="glass-input w-full rounded-xl px-4 py-3 text-sm resize-none"></textarea>
      </div>

      <!-- Submit -->
      <button type="submit"
              class="gradient-btn w-full rounded-xl py-3.5 text-white font-semibold text-sm tracking-wide">
        Kirim Formulir →
      </button>

    </form>
  </div>

</body>
</html>
