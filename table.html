<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Table</h1>
    <table>
        <!-- Table Row -->
        <tr>
        <!-- Table Heading -->
            <th>Nomor</th>
            <th>Nama</th>
            <th>Negara</th>
        </tr>
        <!-- Setiap tr pindah kebawah 1 baris -->
        <tr>
        <!-- Table Data -->
            <td>1</td>
            <td>Ray</td>
            <td>England</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Yar</td>
            <td>Egypt</td>
        </tr>
    </table>
</body>
</html>
